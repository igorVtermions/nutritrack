<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844"><title>Daily targets</title><rect x="0" y="0" width="390" height="844" rx="0" fill="#F7F8F3"/><text x="24" y="29" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="700" fill="#20292D">9:41</text><rect x="321" y="17" width="23" height="11" rx="3" fill="#20292D"/><rect x="348" y="20" width="2" height="5" rx="1" fill="#20292D"/><rect x="291" y="26" width="3" height="3" rx="1" fill="#20292D"/><rect x="296" y="23" width="3" height="6" rx="1" fill="#20292D"/><rect x="301" y="20" width="3" height="9" rx="1" fill="#20292D"/><rect x="306" y="17" width="3" height="12" rx="1" fill="#20292D"/><g transform="translate(20 63) scale(1)" fill="none" stroke="#20292D" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m14 5-7 7 7 7"/></g><text x="56" y="82" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="750" fill="#20292D">Daily targets</text><text x="20" y="122" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="400" fill="#667078">Choose the numbers that work for you.</text><rect x="20" y="150" width="350" height="99" rx="20" fill="#EEF5D8"/><text x="37" y="181" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="700" fill="#20292D">A guide, not a grade.</text><text x="37" y="207" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="400" fill="#667078">Your targets are personal and editable.</text><text x="37" y="228" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="400" fill="#667078">These are example values.</text><text x="20" y="283" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="600" fill="#667078">Daily energy</text><rect x="20" y="295" width="350" height="54" rx="20" fill="#FFFFFF"/><text x="36" y="328" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="500" fill="#20292D">2,000 kcal</text><g transform="translate(337 312) scale(0.75)