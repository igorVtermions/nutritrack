<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844"><title>First day</title><rect x="0" y="0" width="390" height="844" rx="0" fill="#F7F8F3"/><text x="24" y="29" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="700" fill="#20292D">9:41</text><rect x="321" y="17" width="23" height="11" rx="3" fill="#20292D"/><rect x="348" y="20" width="2" height="5" rx="1" fill="#20292D"/><rect x="291" y="26" width="3" height="3" rx="1" fill="#20292D"/><rect x="296" y="23" width="3" height="6" rx="1" fill="#20292D"/><rect x="301" y="20" width="3" height="9" rx="1" fill="#20292D"/><rect x="306" y="17" width="3" height="12" rx="1" fill="#20292D"/><text x="20" y="101" font-family="Inter, Arial, sans-serif" font-size="34" font-weight="750" fill="#20292D">Your day</text><text x="20" y="132" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="400" fill="#667078">One meal at a time.</text><rect x="20" y="169" width="350" height="227" rx="24" fill="#20292D"/><text x="41" y="210" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="700" fill="#FFFFFF">Daily intake</text><text x="41" y="279" font-family="Inter, Arial, sans-serif" font-size="55" font-weight="750" fill="#FFFFFF">0</text><text x="41" y="310" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="400" fill="#BCC5CB">of 2,000 kcal</text><text x="41" y="367" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="600" fill="#DEFA64">Your day starts here.</text><g transform="translate(144 422) scale(1.275)"><circle cx="40" cy="40" r="38" fill="#EEF5D8"/><ellipse cx="40" cy="41" rx="28" ry="12" fill="#E3D8BD"/><path d="M12 40c1 35 54 35 56 0" fill="#FFFEF8" stroke="#DADDD1"/><ellipse cx="40" cy="39" rx="26" ry="11" fill="#D6BB8A"/><circle cx="28" cy="37" r="6" fill="#36516C"/><circle cx="42" cy="33" r="5" fill="#36516C"/><path d="M49 35c12-14 18 1 7 9Z" fill="#E87962"/></g><text x="51" y="564" font-family="Inter, Arial, sans-serif" font-size="25" font-weight="750" fill="#20292D">Your first meal awaits</text><text x="48" y="597" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="400" fill="#667078">Add something you ate to start your log.</text><text x="83" y="621" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="400" fill="#667078">Every small entry tells your story.</text><rect x="20" y="683" width="350" height="54" rx="17" fill="#DEFA64"/><text x="195" y="716" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="700" fill="#20292D">+  Log your first meal</text><rect x="0" y="748" width="390" height="96" rx="0" fill="#FFFFFF"/><path d="M0 748L390 748" stroke="#E3E7DF"/><rect x="30" y="758" width="54" height="34" rx="12" fill="#EEF5D8"/><g transform="translate(45 763) scale(1)" fill="none" stroke="#20292D" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10 12 3 21 10v11h-6v-7H9v7H3Z"/></g><text x="36" y="813" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="700" fill="#20292D">Today</text><g transform="translate(141 763) scale(1)" fill="none" stroke="#20292D" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20V12h3v8M10 20V8h3v12M16 20V3h3v17"/></g><text x="132" y="813" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="500" fill="#667078">History</text><g transform="translate(237 763) scale(1)" fill="none" stroke="#20292D" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 3v7m4-7v7M3 3v5a4 4 0 0 0 8 0V3M7 12v9M19 3c-4 3-4 9 0 9V3m0 9v9"/></g><text x="228" y="813" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="500" fill="#667078">Foods</text><g transform="translate(333 763) scale(1)" fill="none" stroke="#20292D" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v3m0 12v3M3 12h3m12 0h3M5.6 5.6l2 2m8.8 8.8 2 2M5.6 18.4l2-2m8.8-8.8 2-2M17 12a5 5 0 1 1-10 0 5 5